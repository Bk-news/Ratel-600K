<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>إعداد كلمات المرور</title>
<style>
body{font-family:system-ui,"Segoe UI",Tahoma,sans-serif;background:#f4f3f1;margin:0;padding:24px;color:#0a0a0a}
main{max-width:520px;margin:auto;background:#fff;border:1px solid #e4e3e0;border-radius:8px;padding:24px;display:grid;gap:14px}
h1{margin:0;font-size:22px}p{margin:0;color:#5f5d58;line-height:1.7}
label{display:grid;gap:6px;font-weight:500}
input{height:38px;padding:0 12px;border:1px solid #cfcdc8;border-radius:6px;font:inherit}
button{height:40px;border:0;border-radius:6px;background:#161616;color:#fff;font:inherit;cursor:pointer}
textarea{width:100%;height:170px;direction:ltr;font-family:monospace;font-size:12px;box-sizing:border-box}
</style></head><body><main>
<h1>إعداد كلمات المرور</h1>
<p>اكتب كلمة مرور لكل شخص. تُحسب البصمات داخل متصفحك فقط ولا يُرسل شيء لأي جهة. ثم انسخ الناتج إلى ملف <b dir="ltr">auth-config.js</b> في GitHub.</p>
<label>عبدالله الجليل<input type="text" id="p_director" autocomplete="off"></label>
<label>خالد المصعبي<input type="text" id="p_khalid" autocomplete="off"></label>
<label>صالح الطالبي<input type="text" id="p_saleh" autocomplete="off"></label>
<label>بسام الأسمري<input type="text" id="p_bassam" autocomplete="off"></label>
<button id="go">توليد الملف</button>
<textarea id="out" readonly placeholder="سيظهر الناتج هنا"></textarea>
<button id="cp" hidden>نسخ</button>
<script>
const ITER=200000,enc=new TextEncoder(),IDS=['director','khalid','saleh','bassam'];
const hex=b=>[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');
async function h(pw,salt){const k=await crypto.subtle.importKey('raw',enc.encode(pw),'PBKDF2',false,['deriveBits']);return hex(await crypto.subtle.deriveBits({name:'PBKDF2',hash:'SHA-256',salt:enc.encode(salt),iterations:ITER},k,256))}
document.getElementById('go').onclick=async()=>{
  const users={};
  for(const id of IDS){const pw=document.getElementById('p_'+id).value;if(pw.length<6){alert('كل كلمة مرور 6 أحرف على الأقل');return}
    const salt=hex(crypto.getRandomValues(new Uint8Array(16)));users[id]={salt,hash:await h(pw,salt)}}
  document.getElementById('out').value='window.TEAM_AUTH = '+JSON.stringify({iter:ITER,users},null,2)+';\n';
  document.getElementById('cp').hidden=false;
};
document.getElementById('cp').onclick=()=>{const o=document.getElementById('out');o.select();document.execCommand('copy')};
</script></main></body></html>
